<div
  class="flex shrink-0 flex-row items-center gap-3 sm:w-36 sm:flex-col sm:items-start sm:gap-2 sm:border-r sm:border-line sm:px-4 sm:py-1"
>
  <app-avatar [imagen]="imagen()" [nombre]="nombre()" tam="h-14 w-14 text-base" />
  <div class="min-w-0 text-left">
    <p class="truncate font-display text-sm font-semibold text-paper">{{ nombre() }}</p>
    <span
      class="mt-0.5 inline-block rounded-full px-2.5 py-0.5 text-[11px] font-medium"
      [class]="PERFIL_CLASES[perfil()]"
    >
      {{ PERFIL_LABEL[perfil()] }}
    </span>
    <p class="mt-1.5 text-xs leading-tight text-dim">
      Miembro desde:
      <span class="text-paper/70">{{ formatearFecha(ingreso()) }}</span>
    </p>
    <p class="text-xs leading-tight text-dim">
      {{ esRespuesta() ? 'Respondió:' : 'Publicado:' }}
      <span class="text-paper/70">{{ formatearFecha(fecha()) }}</span>
    </p>
  </div>
</div>
