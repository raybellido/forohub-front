<div class="mx-auto max-w-5xl px-4 py-8">
  <div class="mb-6 flex flex-wrap items-center justify-between gap-4">
    <div>
      <h1 class="font-display text-3xl font-bold tracking-tight text-paper">Mis tópicos</h1>
      <p class="mt-1 text-sm text-dim">Los tópicos que creaste en el foro</p>
    </div>
    <a
      routerLink="/topicos/nuevo"
      class="rounded-lg bg-accent px-4 py-2 text-sm font-semibold text-accent-fg transition-colors hover:bg-accent-strong"
    >
      Nuevo tópico
    </a>
  </div>

  <app-topicos-lista
    [topicos]="misTopicos()"
    [cargando]="cargando()"
    [error]="error()"
    vacioTitulo="Aún no has creado tópicos."
    vacioMensaje="Crea tu primera discusión para que aparezca aquí."
    vacioCtaRuta="/topicos/nuevo"
    vacioCtaTexto="Crear mi primer tópico"
  />
</div>
