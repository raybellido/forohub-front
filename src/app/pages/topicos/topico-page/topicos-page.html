<div class="mx-auto max-w-5xl px-4 py-8">
  <div class="mb-6 flex flex-wrap items-center justify-between gap-4">
    <div>
      <h1 class="font-display text-3xl font-bold tracking-tight text-paper">Tópicos del foro</h1>
      <p class="mt-1 text-sm text-dim">Preguntas, discusiones y respuestas de la comunidad</p>
    </div>
    <a
      routerLink="/topicos/nuevo"
      class="rounded-lg bg-accent px-4 py-2 text-sm font-semibold text-accent-fg transition-colors hover:bg-accent-strong"
    >
      Nuevo tópico
    </a>
  </div>

  <div class="mb-6 flex flex-col gap-3">
    <div class="flex flex-col gap-3 min-[480px]:flex-row min-[480px]:flex-wrap min-[480px]:items-center">
      <input
        type="search"
        [value]="tituloBusqueda()"
        (input)="setTituloBusqueda($event)"
        placeholder="Buscar por título…"
        aria-label="Buscar tópicos por título"
        class="w-full rounded-lg border border-line bg-ink-deep px-3 py-2 text-sm text-paper placeholder:text-dim/60 focus:border-accent focus-visible:outline-2 focus-visible:outline-accent focus-visible:outline-offset-2 min-[480px]:w-64"
      />

      <select
        [value]="cursoIdFiltro() ?? ''"
        (change)="setCursoFiltro($event)"
        aria-label="Filtrar por curso"
        class="select-outlined w-full appearance-none rounded-lg border border-line bg-ink-deep px-3 py-2 pr-9 text-sm text-paper focus:border-accent focus-visible:outline-2 focus-visible:outline-accent focus-visible:outline-offset-2 min-[480px]:w-auto"
      >
        <option value="">Todos los cursos</option>
        @for (curso of cursos(); track curso.id) {
          <option [value]="curso.id">{{ curso.nombre }}</option>
        }
      </select>

      <select
        [value]="statusFiltro() ?? ''"
        (change)="setStatusFiltro($event)"
        aria-label="Filtrar por estado"
        class="select-outlined w-full appearance-none rounded-lg border border-line bg-ink-deep px-3 py-2 pr-9 text-sm text-paper focus:border-accent focus-visible:outline-2 focus-visible:outline-accent focus-visible:outline-offset-2 min-[480px]:w-auto"
      >
        <option value="">Todos los estados</option>
        @for (status of statuses; track status) {
          <option [value]="status">{{ STATUS_TOPICO_LABEL[status] }}</option>
        }
      </select>

      <select
        [value]="orden()"
        (change)="setOrden($event)"
        aria-label="Ordenar tópicos"
        class="select-outlined w-full appearance-none rounded-lg border border-line bg-ink-deep px-3 py-2 pr-9 text-sm text-paper focus:border-accent focus-visible:outline-2 focus-visible:outline-accent focus-visible:outline-offset-2 min-[480px]:w-auto"
      >
        @for (opcion of ordenes; track opcion.id) {
          <option [value]="opcion.id">{{ opcion.label }}</option>
        }
      </select>
    </div>
  </div>

  <app-topicos-lista
    [topicos]="ordenados()"
    [cargando]="cargando()"
    [error]="error()"
    vacioTitulo="No hay tópicos que coincidan con la búsqueda."
    vacioMensaje="Prueba ajustando los filtros o crea una nueva discusión."
    vacioCtaRuta="/topicos/nuevo"
    vacioCtaTexto="Crear el primer tópico"
  />
</div>
